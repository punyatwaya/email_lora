<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Our Love Story ❤️</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* FLOATING HEARTS */
.heart-float {
    position: absolute;
    bottom: -20px;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
    opacity: 0.6;
}

@keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-110vh); opacity: 0; }
}

/* PAGE CARD */
.page {
    display: none;
    background: white;
    width: 340px;
    border-radius: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    padding: 25px;
    text-align: center;
    animation: pageIn 0.9s ease;
    z-index: 2;
}

.page.active {
    display: block;
}

@keyframes pageIn {
    from { opacity: 0; transform: scale(0.9) translateY(30px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

h2 {
    color: #ff4d6d;
}

p {
    color: #555;
    font-size: 15px;
    line-height: 1.6;
}

button {
    margin-top: 18px;
    padding: 11px 24px;
    border: none;
    border-radius: 30px;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #e63956;
}

/* TYPING TEXT */
.typing {
    border-right: 2px solid #ff4d6d;
    white-space: nowrap;
    overflow: hidden;
    width: 0;
    animation: typing 4s steps(40) forwards;
}

@keyframes typing {
    to { width: 100%; }
}

/* GALLERY SLIDESHOW */
.slideshow img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 14px;
    animation: zoomFade 6s infinite;
}

@keyframes zoomFade {
    0% { opacity: 0; transform: scale(1.1); }
    20% { opacity: 1; transform: scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; }
}

/* VIDEO ANIMATION */
video {
    width: 100%;
    border-radius: 15px;
    margin-top: 10px;
    animation: videoIn 1.2s ease;
}

@keyframes videoIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
}

/* HEART */
.big-heart {
    font-size: 40px;
    animation: beat 1s infinite;
    margin: 10px 0;
}

@keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
}
</style>
</head>

<body>

<!-- FLOATING HEARTS -->
<span class="heart-float" style="left:10%">❤️</span>
<span class="heart-float" style="left:30%">💖</span>
<span class="heart-float" style="left:50%">❤️</span>
<span class="heart-float" style="left:70%">💘</span>
<span class="heart-float" style="left:90%">❤️</span>

<!-- PAGE 1 -->
<div class="page active" id="p1">
    <h2 class="typing">Hey My Love 💕</h2>
    <p>
        You came into my life  
        and made everything beautiful ❤️
    </p>
    <div class="big-heart">❤️</div>
    <button onclick="next(1)">Start Our Story 💌</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
    <h2>Our Memories 📸</h2>
    <div class="slideshow">
        <img src="./pk1.jpeg" alt="Memory 1">
        <img src="./pk2.jpeg" alt="Memory 2">
        <img src="./pk3.jpeg" alt="Memory 3">
        <img src="./pk4.jpeg" alt="Memory 4">
        <img src="./pk5.jpeg" alt="Memory 5">
        <img src="./pk6.jpeg" alt="Memory 6">
    </div>
    <p>You are my favorite memory 💖</p>
    <button onclick="next(2)">Watch Video 🎥</button>
</div>

<style>
.page {
    padding: 20px;
    text-align: center;
}

/* Horizontal scrollable slideshow */
.slideshow {
    display: flex;
    gap: 15px;
    overflow-x: auto;
    padding-bottom: 10px;
    scroll-behavior: smooth;
}

.slideshow::-webkit-scrollbar {
    height: 8px;
}

.slideshow::-webkit-scrollbar-thumb {
    background: rgba(0,0,0,0.3);
    border-radius: 4px;
}

.slideshow img {
    flex: 0 0 auto; /* Prevent images from shrinking */
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    transition: transform 0.3s, box-shadow 0.3s;
    cursor: pointer;
}

/* Hover effect for interactive feel */
.slideshow img:hover {
    transform: scale(1.1) rotate(2deg);
    box-shadow: 0 12px 25px rgba(0,0,0,0.5);
}
</style>

<!-- PAGE 3 -->
<div class="page" id="p3">
    <h2>Our Video 🎥</h2>
    <video controls>
        <source src="pk1.mp4" type="video/mp4">
    </video>
    <button onclick="next(3)">Final Message 💍</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="p4">
    <h2>Forever Us ❤️</h2>
    <p>
        No matter what happens,  
        I choose you every day.  
        Forever and always 💕
    </p>
    <div class="big-heart">❤️</div>
</div>

<script>
function next(n) {
    document.getElementById("p" + n).classList.remove("active");
    document.getElementById("p" + (n + 1)).classList.add("active");
}
</script>

</body>
</html>
